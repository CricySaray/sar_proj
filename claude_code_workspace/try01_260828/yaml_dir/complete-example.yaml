# ==========================================
# 完整示例：一个自动化部署工作流的YAML配置
# ==========================================

# 工作流基本信息
name: 生产环境自动化部署
description: |
  从代码检出到部署上线的完整自动化流程。
  支持条件触发、失败重试、通知团队。

# 触发条件
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  manual: true  # 支持手动触发

# 全局环境变量
env:
  NODE_ENV: production
  AWS_REGION: cn-north-1
  CLUSTER_NAME: production
  DEBUG: false

# 默认配置 - 所有步骤继承这些配置
defaults: &defaults
  enabled: true
  retry: 2
  timeout: 300
  notify_on_failure: true
  working_dir: ./app

# 模板：部署步骤公共配置
deploy_template: &deploy_template
  <<: *defaults
  provider: kubernetes
  namespace: default
  image_repository: my-app

# 定义步骤 - 顺序执行
steps:
  # 第一步：检出代码
  - name: 检出代码
    <<: *defaults
    action: git-checkout
    params:
      repository: https://github.com/your-org/your-app.git
      branch: main
      depth: 1
    timeout: 120

  # 第二步：安装依赖
  - name: 安装依赖
    <<: *defaults
    action: npm-install
    params:
      cache: true
      production: true
    # 只有package.json变化才重新安装
    when:
      changed: package-lock.json

  # 第三步：代码检查
  - name: 代码静态检查
    <<: *defaults
    action: eslint
    params:
      src_dir: src/
      fail_on_error: true
    parallel:
      - name: 类型检查
        action: typescript-check

  # 第四步：运行测试
  - name: 单元测试
    <<: *defaults
    action: npm-run
    params:
      command: test:unit
      coverage: true

  - name: 集成测试
    <<: *defaults
    action: npm-run
    params:
      command: test:integration
    depends_on: [单元测试]

  # 第五步：构建应用
  - name: 构建生产版本
    <<: *defaults
    action: npm-run
    params:
      command: build
      output_dir: dist
    timeout: 600

  # 第六步：构建Docker镜像
  - name: 构建Docker镜像
    <<: *defaults
    action: docker-build
    params:
      dockerfile: ./Dockerfile
      context: .
      push: true
    timeout: 600

  # 第七步：部署 - 根据环境不同略有差异
  - name: 部署到Kubernetes(预发布)
    <<: *deploy_template
    environment: staging
    replicas: 2

  - name: 运行E2E测试
    <<: *defaults
    action: run-e2e
    environment: staging
    depends_on: [部署到Kubernetes(预发布)]

  - name: 部署到Kubernetes(生产)
    <<: *deploy_template
    environment: production
    replicas: 5
    when:
      branch: main
      result: success  # 前面必须都成功
    depends_on: [运行E2E测试]

  # 最后一步：通知
  - name: 通知团队
    <<: *defaults
    action: slack-notify
    params:
      channel: "#deploy-alerts"
      message: |
        部署完成: ${{WORKFLOW_NAME}}
        版本: ${{TAG_NAME}}
        状态: ${{STATUS}}
    when:
      always: true  # 不管成功失败都通知
